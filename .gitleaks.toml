# GitLeaks Configuration
# https://github.com/gitleaks/gitleaks

title = "Réfugiés.info Playground - Secret Detection"

[extend]
# Use the default gitleaks config as base
useDefault = true

# Global allowlist for false positives
[allowlist]
description = "Global allowlist for false positives"
paths = [
  # Supabase seed data uses example.com emails (safe)
  # Matches both supabase/seed.sql and supabase/seed/*.sql
  '''supabase/seed.*\\.sql''',
  # Test files may contain example secrets
  '''tests/.*''',
  '''\.test\.(ts|tsx|js|jsx)$''',
  # Storybook stories
  '''\.stories\.(ts|tsx|js|jsx)$''',
]
regexes = [
  # Allow example.com email addresses (RFC 2606 reserved domain)
  '''[a-zA-Z0-9._%+-]+@example\.com''',
  # Allow placeholder bcrypt passwords in seed data
  '''\$2[aby]?\$[0-9]{2}\$[A-Za-z0-9./]{53}''',
]
