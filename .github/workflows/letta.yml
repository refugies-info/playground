name: Letta Code
# One automation on the same agent (vars.LETTA_AGENT_ID, shared with karfur),
# with several entry points:
#   - PR opened / reopened / synchronize / ready_for_review: a review pass
#     fires automatically, no mention required.
#   - New issues, or the `letta-code` label.
#   - Comments and review comments, but only when they mention `@letta-code`.
# `prompt:` is set, so the action always picks its "agent" mode — including for
# mentions (src/modes/detector.ts returns "agent" as soon as `prompt` is set).
# A mention therefore buys another review pass in the same thread, not a
# branch-pushing interactive session. Each pass runs the full review prompt on
# a fresh conversation against the shared agent (`letta_args: --new` below);
# it does not resume the pass it opened for this PR. See
# https://github.com/letta-ai/letta-code-action#automated-workflows
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: letta-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  letta:
    # Skip Dependabot auto-bumps only. We deliberately do NOT use
    # `github.event.sender.type != 'Bot'` because that would also exclude
    # release-please, future automation bots, and the action's own
    # github-actions identity, all of which may legitimately need a review.
    #
    # Label events are restricted to the `letta-code` label. Neither repo has
    # it today, so in practice no label ever triggers a pass — which is the
    # point: without this clause, adding ANY label ("bug", "enhancement", and
    # on karfur release-please's "autorelease: pending") started a full review
    # pass on the PR.
    #
    # Comment events additionally require an explicit `@letta-code` mention.
    # Without that gate, EVERY new comment started a full review pass:
    # Vercel/Supabase status comments, other review bots, and the agent's own
    # replies to the author. Of the 100 most recent runs of this workflow, 38
    # started from `issue_comment` alone — more than `pull_request` (31) or
    # `pull_request_review_comment` (31) — while PR #331 burned 5 passes on a
    # handful of findings. PR events (opened / synchronize / reopened) are
    # untouched, so release-please PRs are still reviewed on open and
    # incremental reviews still fire when commits land.
    if: >-
      github.event.sender.login != 'dependabot[bot]' &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'letta-code') &&
      (github.event_name != 'issue_comment' &&
       github.event_name != 'pull_request_review_comment' ||
       contains(github.event.comment.body, '@letta-code'))
    runs-on: ubuntu-latest
    # Review only: the agent comments, it does not commit or push. On agent
    # mode this job never pushes, so `contents: read` costs nothing and makes
    # the boundary structural rather than a prompt-level promise.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Install the Letta Code CLI from npm. The action's bundled binary can
      # lag behind @letta-ai/letta-code on npm, so we install explicitly and
      # pass the resolved path via path_to_letta_executable. We deliberately
      # use `@latest`: getting the freshest CLI is the whole point of this
      # step. Supply-chain risk is accepted as a trade-off, but it is bounded
      # by this job's permissions: a compromised package can read the repo and
      # post comments, not push. Mitigation lives upstream (Letta's npm
      # publishing process) rather than in pin/version policy.
      # https://github.com/letta-ai/letta-code-action#using-the-latest-cli
      - name: Install Letta Code CLI
        id: letta-bin
        run: |
          npm install -g @letta-ai/letta-code@latest
          echo "path=$(command -v letta)" >> "$GITHUB_OUTPUT"

      # Pinned to a commit on main instead of a tag. `@v0` and `v0.0.6` both
      # resolve to b50e45b (2026-04-15), where agent mode emitted neither
      # `agent_id` nor `conversation_id` — only tag mode did. So
      # `LETTA_AGENT_ID` reached the runner empty, it fell back to
      # auto-discovery, and every run created a fresh agent with no
      # conversation to resume. That is also why this workflow used to smuggle
      # the agent through `letta_args`. On b7e51ed (2026-09-15) agent mode reads
      # `agent_id` (modes/agent/index.ts), which is what makes the input below
      # effective. It also looks up a conversation by summary
      # (`PR #<n> owner/repo`) and, when the lookup hits, sets `conversation_id`
      # and `is_followup` — which is why every run died with
      # `404 Conversation not found` on 2026-09-21 (PR #332): run-letta.ts
      # resumes with `--conversation <id>` whenever `letta_args` carries no
      # override. That same `is_followup` flag swaps `followup_prompt` in for
      # `prompt`, so those runs were also handed the delta-only follow-up text.
      # `letta_args: --new` below takes the fresh-conversation branch instead.
      # No upstream tag covers this revision: bump the SHA, do not go back to a
      # floating tag.
      - uses: letta-ai/letta-code-action@b7e51edb0643e67ae74327a1cdf0c332e549f8fc
        with:
          letta_api_key: ${{ secrets.LETTA_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Now a real input on the pinned revision, read in agent mode. The
          # workflow used to smuggle it through `letta_args: --agent …`, which
          # run-letta.ts treats as "switch agent" and pairs with `--new`; the
          # input is equivalent and less surprising.
          agent_id: ${{ vars.LETTA_AGENT_ID }}
          # Start a fresh conversation per pass. The action resolves a
          # conversation for this PR and passes `--conversation <id>` when it
          # finds one, which fails — see the pin comment above. `--new` is also
          # exactly what the previous `letta_args: --agent …` produced, so this
          # is the invocation already known to run end-to-end here.
          letta_args: --new
          # "auto" lets the Letta platform pick the best model for the task.
          model: auto
          path_to_letta_executable: ${{ steps.letta-bin.outputs.path }}
          # Auto-review prompt. The agent is shared with karfur and therefore
          # karfur-tuned, so this prompt focuses the review on playground's
          # own stack, conventions, and gotchas. Review comments target the
          # French-speaking team; code suggestions stay in English.
          prompt: |
            You are reviewing a pull request on the Réfugiés.info Content
            Playground monorepo (apps/frontend on Next.js 16, packages/*
            workspaces, Supabase, Vercel Workflow, Letta Cloud, Biome, pnpm).
            The agent is shared with karfur, so you do NOT have playground
            memory loaded — read AGENTS.md,
            `documentation/guides/coding-conventions.md` and the relevant docs
            under `documentation/` for context.

            Review only. Never edit, commit or push: this job has read-only
            repository access, and "helpfully" fixing the PR on your own
            initiative puts an unrelated commit on someone else's branch.

            Write your review comments in French (the team is French-speaking);
            keep code suggestions and identifiers in English.

            Budget — treat this as a hard constraint. A review that restates
            the diff costs the author more than it gives them:
            - One pass. No summary comment, no re-stating of the diff, no
              praise padding, no tables.
            - Review body: 5 bullets maximum, in the region of 1200 characters.
            - Inline comments: 5 maximum, reserved for what blocks merge or
              risks a production incident. Fold nits into a single bullet; do
              not file what Biome already enforces.
            - Never re-raise a finding that already exists in a review thread
              on this PR, and say nothing about what the author has since
              fixed.
            - If nothing blocks merge, say so in one sentence and approve.

            Focus areas — only flag what blocks merge or risks a production
            incident:
            1. Supabase safety: raw SQL (no ORM), RLS policies, migrations
               created via `pnpm supabase migration new` (never via dashboard
               alone), trigger functions updated in the same migration that
               drops the column they reference, zero-downtime pattern when
               moving data between columns.
            2. Workflow / orchestration: Vercel Workflow 4.x patterns, atomic
               updates when persisting `vercel_workflow_id` after `start()`,
               webhook-vs-poll decisions tracked in
               `documentation/architecture/gotchas/workflow-questions.md`.
            3. Letta Cloud: agent/tool versioning, Python type hints limited to
               JSON-schema primitives (str/int/float/bool/None), secrets stored
               on the agent and read via `os.getenv()` rather than hardcoded
               in tool source, paginated `client.agents.blocks.list()` is NOT
               an array (use try/catch on the update call). See
               `documentation/architecture/gotchas/letta-sdk.md`.
            4. Markdown pipeline: `normalizeMarkdown` (fence-length strategy)
               is load-bearing; do not change it without coordination with
               Jérémie — see `documentation/architecture/gotchas/markdown.md`.
            5. Monorepo hygiene: pnpm only (no npm/yarn/npx — use `pnpx` for
               one-off CLI tools), `pnpm add <pkg> --filter <workspace>` for
               new deps, raw SQL for Supabase (no ORM), Biome for lint/format
               (not ESLint/Prettier), no class-based patterns when a pure
               function will do.
            6. Pre-push quality gates: PRs that don't pass `pnpm lint`,
               `pnpm check:types`, and `pnpm test` locally should not enter
               review — call this out for the author. The `security:scan:js`
               CVE gate must not be bypassed or routed around; if it blocks an
               unrelated change, that is a flag for the team, not a silent
               `--no-verify`.
            7. Worktree discipline: never commit directly to `main`; PRs
               should originate from `wt switch --create feat/...` or
               `name/ri-XXXX-...` branches.
            8. Conventional Commits: PR title follows `type(scope):` format;
               this is the squash-merge message consumed on main.
            9. Documentation: AGENTS.md and the docs under `documentation/`
               are the source of truth for conventions — if a PR contradicts
               them, either the PR is wrong or the doc needs updating; flag
               both, do not silently let them drift.
            10. Coding conventions
                (`documentation/guides/coding-conventions.md`): camelCase
                variables/functions, `kebab-case` file names except React
                components (`PascalCase.tsx`), shared types in
                `@playground/shared-types`, functional style (no classes,
                plain data over stateful objects), no duplication, short
                English comments reserved for a non-obvious rule, French only
                for user-facing content, shadcn/ui primitives before bespoke
                components, and no data access in presentational components —
                reads go through the Supabase client at page/feature level,
                writes through API routes using the Service Role Key.

            Be surgical. Do not block the PR for stylistic nits or refactoring
            opportunities — call those out as suggestion comments only. If the
            PR is clean for its stated scope, say so briefly and approve.

            Comment on the pull request itself. Each pass runs on a fresh
            conversation, so anything you want the author to see has to be a
            comment on this PR — never a note to yourself.
          # Deliberately no `followup_prompt` here. Agent mode sets
          # `is_followup` from the summary lookup above, which runs whether or
          # not `--new` is passed, and the action prefers `followup_prompt` over
          # `prompt` whenever it is set. With `--new` there is no prior review to
          # diff against, so a follow-up prompt would mean a delta review of
          # nothing. Re-add it only together with real conversation resumption.
