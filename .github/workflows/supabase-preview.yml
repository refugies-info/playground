# Replaces Supabase "Automatic branching" (disabled in the dashboard) so that
# draft PRs don't consume the preview branch quota. Once created, the branch
# stays linked to the git branch and the GitHub integration keeps applying
# migrations on each push.
# The Supabase Vercel integration doesn't sync env vars for branches created
# through the API, so the new branch's URL and keys are pushed to Vercel here.
# SUPABASE_ACCESS_TOKEN is a scoped token: this project only,
# "Development Branches" read-write and "API keys" read, nothing else.
# VERCEL_TOKEN: refugies-info team scope, to write preview env vars and redeploy.
name: Supabase Preview Branch

on:
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        converted_to_draft,
        closed,
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}

jobs:
  preview-branch:
    if: github.head_ref != 'main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_API: https://api.supabase.com/v1
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GIT_BRANCH: ${{ github.head_ref }}
      SHOULD_EXIST: ${{ github.event.action != 'closed' && !github.event.pull_request.draft }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Create or delete the preview branch
        id: branch
        run: |
          api() { curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" "$@"; }

          BRANCH_ID=$(api "$SUPABASE_API/projects/$SUPABASE_PROJECT_REF/branches" \
            | jq -r --arg git "$GIT_BRANCH" '.[] | select(.git_branch == $git and .is_default == false and .persistent == false) | .id')

          if [ "$SHOULD_EXIST" = "true" ] && [ -z "$BRANCH_ID" ]; then
            BRANCH_ID=$(api -X POST "$SUPABASE_API/projects/$SUPABASE_PROJECT_REF/branches" \
              -d "$(jq -n --arg git "$GIT_BRANCH" '{branch_name: $git, git_branch: $git}')" | jq -r '.id')
            echo "created_id=$BRANCH_ID" >> "$GITHUB_OUTPUT"
          elif [ "$SHOULD_EXIST" = "false" ] && [ -n "$BRANCH_ID" ]; then
            api -X DELETE "$SUPABASE_API/branches/$BRANCH_ID"
          fi

      - name: Point the Vercel preview at the new branch
        if: steps.branch.outputs.created_id != ''
        env:
          BRANCH_ID: ${{ steps.branch.outputs.created_id }}
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          api() { curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$@"; }
          vercel() { curl -sSf -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" "$@"; }

          # GET /branches/{id} only reports the project health; migration status is on the list endpoint.
          for _ in $(seq 60); do
            BRANCH=$(api "$SUPABASE_API/projects/$SUPABASE_PROJECT_REF/branches" | jq -c --arg id "$BRANCH_ID" '.[] | select(.id == $id)')
            STATUS=$(jq -r '.status' <<< "$BRANCH")
            echo "Supabase branch status: $STATUS"
            case "$STATUS" in
              MIGRATIONS_PASSED|FUNCTIONS_DEPLOYED) break ;;
              MIGRATIONS_FAILED|FUNCTIONS_FAILED) exit 1 ;;
            esac
            sleep 10
          done
          case "$STATUS" in MIGRATIONS_PASSED|FUNCTIONS_DEPLOYED) ;; *) exit 1 ;; esac

          BRANCH_REF=$(jq -r '.project_ref' <<< "$BRANCH")
          KEYS=$(api "$SUPABASE_API/projects/$BRANCH_REF/api-keys?reveal=true")
          PUBLISHABLE_KEY=$(jq -r '(map(select(.type == "publishable")) + map(select(.name == "anon")))[0].api_key' <<< "$KEYS")
          SERVICE_ROLE_KEY=$(jq -r '(map(select(.type == "secret")) + map(select(.name == "service_role")))[0].api_key' <<< "$KEYS")
          echo "::add-mask::$PUBLISHABLE_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"

          jq -n --arg branch "$GIT_BRANCH" --arg url "https://$BRANCH_REF.supabase.co" \
            --arg publishable "$PUBLISHABLE_KEY" --arg service "$SERVICE_ROLE_KEY" '
            {NEXT_PUBLIC_SUPABASE_URL: $url, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: $publishable, SUPABASE_SERVICE_ROLE_KEY: $service}
            | to_entries | map({key, value, type: "encrypted", target: ["preview"], gitBranch: $branch})' \
            | vercel -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID" -d @- > /dev/null

          # The commit's first build ran before these env vars existed.
          vercel -X POST "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID&forceNew=1" \
            -d "$(jq -n --arg project "$VERCEL_PROJECT_ID" --arg ref "$GIT_BRANCH" --arg repo "$REPO_ID" \
              '{name: "playground-prod", project: $project, gitSource: {type: "github", repoId: $repo, ref: $ref}}')" \
            | jq -r '"Redeploy started: https://\(.url)"'
