name: Production Release

on:
  push:
    branches:
      - main

jobs:
  deploy_migrations:
    runs-on: ubuntu-latest
    name: Deploy Database Migrations
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push

  seed_data:
    needs: deploy_migrations
    runs-on: ubuntu-latest
    name: Seed Production Data
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed Users
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
        run: pnpm seed:users

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Link Vercel Project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm vercel link --yes --token $VERCEL_TOKEN

      - name: Trigger DI Ingestion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DI_INGESTION_CRON_SECRET: ${{ secrets.DI_INGESTION_CRON_SECRET }}
        run: |
          pnpm vercel curl "/api/cron/di-ingestion" \
            --token $VERCEL_TOKEN \
            -- --request GET \
            -H "Authorization: Bearer $DI_INGESTION_CRON_SECRET"
