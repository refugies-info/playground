name: Manual DI Ingestion

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Type of ingestion'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - structures
          - services

jobs:
  ingest:
    runs-on: ubuntu-latest
    name: Run DI Ingestion Workflow
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DI_API_KEY: ${{ secrets.DI_API_KEY }}
          PLAYGROUND_AGENT_ID: ${{ secrets.PLAYGROUND_AGENT_ID }}
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
        run: |
          pnpm tsx scripts/test-di-workflow.ts --type ${{ github.event.inputs.type }}
