name: Manual DI Ingestion

on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    name: Trigger DI Ingestion via Vercel
    steps:
      - name: Trigger DI Ingestion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          PROD_URL=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&projectId=$VERCEL_PROJECT_ID&target=production&limit=1&state=READY" \
            | jq -r '.deployments[0].url')

          if [ -z "$PROD_URL" ] || [ "$PROD_URL" = "null" ]; then
            echo "Error: Could not find production deployment URL"
            exit 1
          fi

          echo "Triggering DI ingestion on: https://$PROD_URL"
          curl -sf "https://$PROD_URL/api/cron/di-ingestion" \
            -H "Authorization: Bearer $CRON_SECRET"
