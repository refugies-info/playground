name: Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Lint, Format & Type Check
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if UI or Storybook changed
        id: ui-changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- packages/ui/ apps/storybook/ || true)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Chromium
        if: steps.ui-changed.outputs.changed == 'true'
        run: pnpm --filter @playground/storybook exec playwright install --with-deps chromium

      - name: Lint & Format Check
        run: pnpm biome ci .

      - name: Type check
        run: pnpm check:types

      - name: Run Tests (with Storybook)
        if: steps.ui-changed.outputs.changed == 'true'
        run: pnpm test

      - name: Run Tests (without Storybook)
        if: steps.ui-changed.outputs.changed != 'true'
        run: pnpm turbo test --filter='!@playground/storybook'
