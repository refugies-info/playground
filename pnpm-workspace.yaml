# =============================================================================
# pnpm Workspace Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Monorepo Structure
# -----------------------------------------------------------------------------

# Define which directories contain workspace packages.
# Turborepo orchestrates builds across these packages.
packages:
  - "apps/*"
  - "packages/*"


# -----------------------------------------------------------------------------
# Supply Chain Security
# -----------------------------------------------------------------------------

# Only allow package versions that have been published for at least 7 days
# (10080 minutes). Mitigates attacks using freshly published malicious versions.
# See: https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 10080
# Temporary exclusions go here when a security patch must be installed before
# it reaches the 7-day threshold. Each entry MUST carry a removal date.
# (empty: all deps currently resolve to releases older than 7 days)
minimumReleaseAgeExclude: []

# Prevent downgrading packages to older versions during updates.
# Protects against attacks that republish older vulnerable versions.
# See: https://pnpm.io/settings#trustpolicy
trustPolicy: no-downgrade

# Packages excluded from trustPolicy check. Use for verified packages that
# trigger false positives (e.g., lost provenance attestation between versions).
# See: https://pnpm.io/settings#trustpolicyexclude
trustPolicyExclude:
  - "@letta-ai/letta-client"
  - "@swc/core"
  - "chokidar"
  - "undici"


# -----------------------------------------------------------------------------
# Version Overrides & Build Scripts
# -----------------------------------------------------------------------------

# pnpm >= 10 no longer reads the "pnpm" field from package.json. The overrides
# and build-script allowlists previously declared there now live here.
# See: https://pnpm.io/settings

overrides:
  undici-types: 6.18.2
  vite: 6.4.3
  caniuse-lite: 1.0.30001756
  semver: 7.7.1
  lodash: 4.18.1
  devalue: 5.9.2
  minimatch@5: 5.1.8
  minimatch@9: 9.0.7
  undici@7: 7.29.1
  nanoid@3: 3.3.18
  nanoid@5: 5.1.16
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  "@babel/core@7": 7.29.7
  uuid@11: 11.1.1
  piscina@4: 4.9.3
  linkify-it@5: 5.0.2
  fast-uri@3: 3.1.8
  smol-toml@1: 1.8.0
  body-parser@2: 2.3.0
  postcss@8: 8.5.28
  esbuild@0.28: 0.28.1
  sharp@<0.35.0: 0.35.4
  uuid@8: 11.1.1
  esbuild@0.27: 0.28.1
  next@16: 16.3.6

onlyBuiltDependencies:
  - "@swc/core"
  - better-sqlite3
  - esbuild
  - sharp

ignoredBuiltDependencies:
  - "@sentry/cli"
