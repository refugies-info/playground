openapi: 3.0.0
info:
  title: Mock Documents API
  version: 1.0.0
paths:
  /api/documents:
    get:
      summary: List mock documents
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: status
          schema:
            type: string
            enum: [accepted, rejected]
        - in: query
          name: state
          schema:
            type: string
            enum: [draft, to_process, archived, published]
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MockDocument"
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
components:
  schemas:
    MockDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        date_added:
          type: string
          format: date-time
        status:
          type: string
          enum: [accepted, rejected]
        state:
          type: string
          enum: [draft, to_process, archived, published]
        source:
          type: string
          description: Source system of the document (e.g., 'RCO')
        content:
          type: string
          description: Document content (text or markdown)
        metadata:
          type: object
          description: Arbitrary metadata (JSONB)
